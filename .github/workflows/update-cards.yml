name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-cards.yml"

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
          card: top-langs
          options: "username=Manmadedrummer&layout=compact&langs_count=20&theme=tokyonight&hide_border=true"
          path: "profile-summary-card-output/tokyonight/top-langs.svg"

      - name: Commit top-langs card
        run: |
          git pull --rebase
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/tokyonight/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update top languages percentage card"
          git push

